<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a20">
<title>Shattered Reef · Style Test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a20; color: #efe6cf;
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .ui button { font: 600 13px system-ui, sans-serif; color: #efe6cf; background: #13262dcc; border: 1px solid #5d7d80;
    border-radius: 10px; padding: 0 14px; min-height: 44px; cursor: pointer; touch-action: manipulation; }
  .ui button.on { background: #c9a050; color: #1a1408; border-color: #f0d49b; }
  .tag { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; font: 600 11px system-ui;
    letter-spacing: .12em; text-transform: uppercase; color: #efe6cfb0; pointer-events: none; }
  .ui.hide, .tag.hide { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag" id="tag">Shattered Reef · style test</div>
<div class="ui" id="ui">
  <button data-look="bright">A · Bright</button>
  <button data-look="dark">B · Moody</button>
</div>
<script type="module" src="/src/styletest/main.ts"></script>
</body>
</html>
