name: Playtest reports

# A scripted new player (scripts/playtest.ts) plays an hour of game time on three seeds, and the skill probe measures
# XP rates. Results are committed to reports/playtest/ so anyone who can read the repo (including an AI) can review
# the game's pacing without running anything. See docs/AI_TESTING.md.
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/playtest.ts', 'scripts/probe-skills.ts', '.github/workflows/playtest.yml']
  schedule:
    - cron: '17 3 * * 1' # Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playtest
  cancel-in-progress: true

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Play
        run: |
          mkdir -p reports/playtest
          for seed in 11 23 47; do
            npx vite-node scripts/playtest.ts 60 $seed 2>&1 | grep -v '^art:' > reports/playtest/seed-$seed.txt
          done
          npx vite-node scripts/probe-skills.ts 2>&1 | grep -v '^art:' > reports/playtest/skill-rates.txt
      - name: Summary
        run: |
          {
            echo "# Playtest reports"
            echo
            echo "Generated $(date -u '+%Y-%m-%d %H:%M UTC') from commit ${GITHUB_SHA::7}. A scripted new player plays 60 minutes of game time per seed: it follows the quest tracker, fights, eats, gathers, cooks and banks like a person would. How to read these: docs/AI_TESTING.md."
            echo
            for seed in 11 23 47; do
              echo "## Seed $seed"
              echo '```'
              sed -n '1,6p' reports/playtest/seed-$seed.txt
              echo '```'
              echo "Full log: [seed-$seed.txt](seed-$seed.txt)"
              echo
            done
            echo "## Skill XP rates"
            echo "[skill-rates.txt](skill-rates.txt): XP per hour at every gathering spot, and hours from 1 to 99."
          } > reports/playtest/README.md
      - name: Commit
        run: |
          git config user.name "playtest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/playtest
          git diff --cached --quiet && exit 0
          git commit -m "Playtest reports for ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
